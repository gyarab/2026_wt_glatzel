<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vizitka</title>
    <style>
        /* Vizitka se stínem a zaoblenými rohy */
        .card {
            background-color: #f9f9f9;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 15px;
            margin: 20px auto;
            width: 270px;
            text-align: center;
        }

        /* Obrázek s požadovanou šířkou, rámečkem a zaoblením */
        img {
            width: 250px;
            border: 1px solid #333;
            border-radius: 8px;
        }

        ul {
            text-align: left;
        }

        /* Barevné tlačítko */
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profilový obrázek -->
        <img src="profil.jpg" alt="Profil">

        <h2>Jan Novák</h2>
        <p>Jsem student a učím se dělat webové stránky v HTML a CSS.</p>

        <p><b>Moje 3 oblíbené věci:</b></p>
        <ul>
            <li>Gaming</li>
            <li>Hudba</li>
            <li>Spánek</li>
        </ul>

        <!-- Tlačítko s JS reakcí -->
        <button onclick="alert('Klikl jsi na kontakt!')">Kontakt</button>
    </div>

</body>
</html>

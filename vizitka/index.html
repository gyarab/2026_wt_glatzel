<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Vizitka</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        /* Kontejner vizitky s vyžádanými CSS vlastnostmi */
        .vizitka {
            background-color: #f2f2f2;
            border: 2px solid black;
            border-radius: 10px;
            padding: 15px;
            margin: 0 auto;
            width: 300px;
            text-align: center;
        }

        /* Profilový obrázek: šířka 250px a rámeček */
        img {
            width: 250px;
            border: 1px solid black;
            border-radius: 5px;
            margin: 10px auto;
            display: block;
        }

        /* Zarovnání seznamu vlevo, aby to bylo přehledné */
        ul {
            text-align: left;
        }

        /* Barevné tlačítko */
        button {
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="vizitka">
        <!-- Profilový obrázek (nahraď svým souborem, např. profil.jpg) -->
        <img src="profil.jpg" alt="Profilová fotka">

        <h2>Ondřej Glatzel</h2>
        <p>The TOP G .</p>
        <p>Studuju na Arabské na programovacím oboru.</p>

        <p><strong>3 oblíbené věci:</strong></p>
        <ul>
            <li>Tanec</li>
            <li>Programování</li>
            <li>Hudba</li>
        </ul>

        <!-- Barevné tlačítko s JS akcí -->
        <button onclick="alert('Idk proste tlacitko')">Tlačítko</button>
    </div>

</body>
</html>
